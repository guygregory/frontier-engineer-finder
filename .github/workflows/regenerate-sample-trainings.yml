name: Regenerate SampleTrainings.csv

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate SampleTrainings.csv
        run: python src/mockdata.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/SampleTrainings.csv)" ]]; then
            git add data/SampleTrainings.csv
            git commit -m "chore: regenerate SampleTrainings.csv [skip ci]"
            git push
          else
            echo "No changes to SampleTrainings.csv."
          fi
