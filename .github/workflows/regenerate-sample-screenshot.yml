name: Regenerate SampleScreenshot.png

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture screenshot
        run: |
          python <<'PY'
          import http.server
          import socketserver
          import threading
          from playwright.sync_api import sync_playwright

          PORT = 8765

          class Handler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *args, **kwargs):
                  pass

          httpd = socketserver.TCPServer(("127.0.0.1", PORT), Handler)
          threading.Thread(target=httpd.serve_forever, daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  context = browser.new_context(viewport={"width": 1440, "height": 960})
                  page = context.new_page()
                  page.goto(f"http://127.0.0.1:{PORT}/web/index.html", wait_until="networkidle")
                  # Wait until the demo button becomes visible (script flips inline style)
                  page.wait_for_function(
                      "() => { const b = document.getElementById('demoBtn'); "
                      "return b && getComputedStyle(b).display !== 'none'; }",
                      timeout=15000,
                  )
                  page.click("#demoBtn")
                  page.wait_for_selector("#results", state="visible", timeout=15000)
                  page.wait_for_load_state("networkidle")
                  page.screenshot(path="img/SampleScreenshot.png", full_page=True)
                  browser.close()
          finally:
              httpd.shutdown()
          PY

      - name: Check screenshot was produced
        run: |
          if [[ ! -s img/SampleScreenshot.png ]]; then
            echo "Screenshot file is missing or empty."
            exit 1
          fi

      - name: Commit and push updated screenshot
        run: |
          branch="${GITHUB_REF_NAME}"
          if [[ -z "$branch" ]]; then
            echo "GITHUB_REF_NAME is empty; cannot determine push target branch."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/SampleScreenshot.png
          if [[ -n "$(git status --porcelain img/SampleScreenshot.png)" ]]; then
            git commit -m "chore: regenerate SampleScreenshot.png [skip ci]"
          else
            echo "Screenshot bytes unchanged; creating empty commit to force push."
            git commit --allow-empty -m "chore: regenerate SampleScreenshot.png (unchanged) [skip ci]"
          fi
          if ! git pull --rebase origin "$branch"; then
            echo "Rebase failed while syncing with origin/$branch before push."
            exit 1
          fi
          git push origin "HEAD:$branch"
